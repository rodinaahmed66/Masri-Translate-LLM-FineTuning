name: CI

on:
  push:
    branches: [main,master]
  pull_request:
    branches: [main,master]


jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install ruff==0.4.4        
      - run: ruff check .
      - run: ruff format --check .


  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"        # no torch, no llamafactory
      - run: pytest -v --cov=src --cov-report=term-missing