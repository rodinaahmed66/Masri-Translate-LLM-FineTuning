[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "masri-translate"
version = "0.1.0"
description = "Egyptian Arabic <-> English translation fine-tuning with LLaMA-Factory"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "datasets>=2.19",
  "pydantic>=2",
  "pydantic-settings>=2",
  "pyyaml>=6",
  "sacrebleu",
  "transformers>=4.44",
  "huggingface_hub>=0.23",
]

[project.optional-dependencies]
train = [
  "torch>=2.2",
  "llamafactory[torch,metrics]",
  "wandb>=0.17",
]
metrics = [
  "rouge_chinese",
  "jieba",
  "nltk",
]
serve = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
]
dev = [
  "dvc>=3",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff==0.4.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
