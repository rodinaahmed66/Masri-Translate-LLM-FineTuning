
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "masri-translate"
version = "0.1.0"
description = "Egyptian Arabic <-> English translation fine-tuning with LLaMA-Factory"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "datasets>=2.19",
  "pydantic>=2",
  "pydantic-settings>=2",
  "pyyaml>=6",
  "transformers>=4.44",
  "huggingface_hub>=0.23",
]

[project.optional-dependencies]
train = [
  "torch>=2.2",
  "llamafactory[torch,metrics]",
  "wandb>=0.17",
]
metrics = [
  "sacrebleu",
  "rouge_chinese",
  "jieba",
  "nltk",
]
serve = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff==0.4.4",     
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
