
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "masri-translate"
version = "0.1.0"
description = "Egyptian Arabic <-> English translation fine-tuning with LLaMA-Factory"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "datasets>=2.19",
  "pydantic>=2",
  "pyyaml>=6",
]

[project.optional-dependencies]
train = [
  "torch>=2.2",
  "transformers>=4.44",
  "llamafactory[torch,metrics]",
  "wandb>=0.17",
]
metrics = [
  "sacrebleu",
  "rouge_chinese",
  "jieba",
  "nltk",
]
serve = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
]
