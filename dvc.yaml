stages:
  prepare:
    cmd: python -m src.prepare
    deps:
      - src/prepare.py
      - src/data.py
      - src/scheme.py
      - src/models.py
      - configs/config.py
    outs:
      - data/train.json
      - data/val.json
      - data/test_en2ar.json
      - data/test_ar2en.json

  train:
    cmd: llamafactory-cli train configs/train.yaml
    deps:
      - configs/train.yaml
      - data/train.json
      - data/val.json
      - data/dataset_info.json
    outs:
      - saves/exp10/lora:
          cache: false

  predict_en2ar:
    cmd: llamafactory-cli train configs/eval_en2ar.yaml
    deps:
      - configs/eval_en2ar.yaml
      - data/test_en2ar.json
      - data/dataset_info.json
      - saves/exp10/lora
    outs:
      - saves/exp10/eval_en2ar/generated_predictions.jsonl:
          cache: false

  predict_ar2en:
    cmd: llamafactory-cli train configs/eval_ar2en.yaml
    deps:
      - configs/eval_ar2en.yaml
      - data/test_ar2en.json
      - data/dataset_info.json
      - saves/exp10/lora
    outs:
      - saves/exp10/eval_ar2en/generated_predictions.jsonl:
          cache: false

  metrics:
    cmd: python -m src.evaluate
    deps:
      - src/evaluate.py
      - configs/config.py
      - saves/exp10/eval_en2ar/generated_predictions.jsonl
      - saves/exp10/eval_ar2en/generated_predictions.jsonl
    metrics:
      - saves/exp10/eval_en2ar/metrics.json:
          cache: false
      - saves/exp10/eval_ar2en/metrics.json:
          cache: false
